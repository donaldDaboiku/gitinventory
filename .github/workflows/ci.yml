name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install backend dependencies
        working-directory: gitinventory-backend
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        working-directory: gitinventory-backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gitinventory-frontend/package-lock.json

      - name: Install, build, and lint
        working-directory: gitinventory-frontend
        run: |
          npm ci
          npm run build
          npm run lint
