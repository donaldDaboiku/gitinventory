name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install backend dependencies
        working-directory: gitinventory-backend
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        working-directory: gitinventory-backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gitinventory-frontend/package-lock.json

      - name: Install, build, and lint
        working-directory: gitinventory-frontend
        run: |
          npm ci
          npm run build
          npm run lint

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitinventory-frontend
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/e2e.sqlite
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: file
      MAIL_MAILER: array
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gitinventory-frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: gitinventory-backend
        run: composer install --no-interaction --prefer-dist

      - name: Migrate and seed SQLite API
        working-directory: gitinventory-backend
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/e2e.sqlite
          php artisan migrate --force
          php artisan db:seed --force

      - name: Start API
        working-directory: gitinventory-backend
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/artisan-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/up && exit 0
            sleep 1
          done
          echo 'API failed to start:'
          cat /tmp/artisan-serve.log
          exit 1

      - name: Install frontend and Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: gitinventory-frontend/playwright-report
          retention-days: 7
